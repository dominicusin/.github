name: Reusable JS site CI
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: false
        default: '24'
      build-command:
        type: string
        required: false
        default: 'npm run build'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - run: ${{ inputs.build-command }}
