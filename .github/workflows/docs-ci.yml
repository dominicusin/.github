name: Reusable docs CI
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      config:
        type: string
        required: false
        default: 'mkdocs.yml'
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install mkdocs mkdocs-material
      - name: Build docs
        run: |
          if [ -f "${{ inputs.config }}" ]; then mkdocs build --strict --config-file "${{ inputs.config }}"; else echo "no docs config, skipped"; fi
