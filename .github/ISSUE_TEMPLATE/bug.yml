name: Bug report
about: Report a problem
labels: bug
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Clear description of the issue.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, version, relevant config
